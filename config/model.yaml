path:
  preprocessed_path: "./preprocessed"
audio:
  sampling_rate: 22050
  hop_length: 256
  max_wav_value: 32768.0
  n_mel_channels: 80
transformer:
  encoder_layer: 4
  encoder_head: 2
  encoder_hidden: 256
  conv_filter_size: 1024
  conv_kernel_size: [9, 1]
  encoder_dropout: 0.2

variance_predictor:
  filter_size: 256
  kernel_size: 3
  dropout: 0.5

variance_embedding:
  pitch_quantization: "log"
  energy_quantization: "linear"
  n_bins: 256

max_seq_len: 1000

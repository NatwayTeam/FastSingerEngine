path:
  corpus_path: "./data"
  ckpt_path: "./models"
  log_path: "./out/log"
  result_path: "./out"
checkpoint:
  best_file: "FastSinger.pth"
vocoder:
  path: "./models/hifigan"
  file: "HifiGan.pth"
  config: "config.json"
preprocessing:
  val_size: 1000
  text:
    language: "zh"
  stft:
    filter_length: 1024
    win_length: 1024
  mel:
    mel_fmin: 0
    mel_fmax: 8000
  energy:
    normalization: True
optimizer:
  lr: 0.00004           # 续训用: 峰值降到 4e-5, 使第 10000 步的余弦值接上收尾的 2.0e-05, 不跳变
  min_lr: 0.00001       # 余弦衰减的下限
  warmup_step: 500      # 线性 warmup 的步数, 0 = 不 warmup
  batch_size: 16
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.0
  grad_clip_thresh: 5.0
  grad_acc_step: 1
step:
  total_step: 35000     # 续训: 自 last 的 10000 步再训 25000 步, 约 10h37m (含 41m 预处理)
  log_step: 100
  synth_step: 500
  val_step: 500
  save_step: 1000
# 对抗训练: 三个判别器全部作用在生成的梅尔频谱上 (声码器是冻结的, 不训练).
# realism = 多尺度梅尔频谱判别器 (hinge) + feature matching
# semantics = 逐帧音素交叉熵, 直接要求梅尔频谱里含有指定的音素
# pitch = (梅尔频谱, 输入 f0) 判别器, 要求谐波与要求的音高对齐
adversarial:
  enabled: True
  start_step: 3000        # 先让纯 L1 收敛, 太早开对抗会毁掉重建
  ramp_steps: 1000        # 再线性加权, 避免 L1 -> GAN 目标的突变
  adv_weight: 0.05
  fm_weight: 0.2
  phone_weight: 0.1
  pitch_weight: 0.05
  d_lr: 0.0001
  d_min_lr: 0.00001      # 与生成器同一条余弦曲线的下限
  d_iters: 1
  base_channels: 32
  # 动态权重: 对抗项 = 基础权重 x gain. gain 由两个信号闭环调节
  #   DGap (判别器赢得多狠)  太大 -> 收手;  接近 0 -> 加力
  #   HiGap (高频能量注入)   超过 hi_ceiling -> 强制刹车
  # 音素项是监督锚点, 不随 gain 缩放
  auto_gain: True
  gain_min: 0.01         # 等效 adv_weight 下限
  gain_max: 0.15         # 等效 adv_weight 上限
  eq_target: 0.6         # 可接受的判别器强度 (DGap 取负后的绝对值)
  ctrl_k: 0.05           # 比例系数, 越大收放越快
  ctrl_every: 25
  hi_bands: 12            # 统计高频能量差时只看顶部多少条梅尔频谱频带
  hi_ceiling: 0.2
  # PhoneClassifier 只用真实梅尔频谱训练, 是生成器的语义锚点。持续变强的分类器
  # 会让这个锚点不断漂移, 所以训到 cls_train_until 就冻结, 之后不再更新。
  # 缺省 = start_step + ramp_steps; 填绝对步数可手动指定。
  cls_train_until: 4000
  cls_ce_weight: 0.1      # 分类器在 D 目标里的权重 (冻结后自动失效)
